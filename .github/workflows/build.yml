name: Build mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: chmod +x gradlew && ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: JumpDuplicator
          path: build/libs/*.jar
